<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
</head>
<body>
    
    <h1> product list </h1>

<ul>
  {% for product in products %}
  <li>
    {{ product.name }} - {{ product.price }} تومان<br>
    {% if product.image %}
      <img src="{{ product.image.url }}" alt="{{ product.name }}" width="150">
    {% else %}
      <p> there is no image </p>
    {% endif %}
  </li>
  {% empty %}
    <li> There is no product </li>
  {% endfor %}
</ul>

    
</body>
</html>
