{% extends "base.html" %}
{% block title %}ثبت نظر{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold text-amber-400 mb-6">ثبت نظر برای {{ product.title }}</h2>

<form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-black font-bold py-2 px-4 rounded">
        ثبت نظر
    </button>
</form>
{% endblock %}
