{% extends "base.html" %}

{% block title %}{{ notification.title }}{% endblock %}

{% block content %}
    <div class="glass-card rounded-2xl p-6">
        <h2 class="text-2xl font-semibold text-white mb-4">{{ notification.title }}</h2>
        <p class="text-gray-300 text-lg">{{ notification.message }}</p>
        <p class="text-gray-500 text-sm mt-4">تاریخ ارسال: {{ notification.created_at|date:"Y/m/d - H:i" }}</p>
        <div class="mt-6 flex justify-end">
            <a href="{% url 'notification:notification-list' %}" class="text-amber-400 hover:text-amber-300">بازگشت به لیست اعلان‌ها</a>
        </div>
    </div>
{% endblock %}
