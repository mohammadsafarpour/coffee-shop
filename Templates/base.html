{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}کافه پارسی{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #121212;
            color: #E0E0E0;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Styling for Django form fields */
        form p {
            margin-bottom: 1rem;
        }
        form label {
            display: block;
            margin-bottom: 0.5rem;
            color: #a0aec0; /* gray-400 */
        }
        form input, form password {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #E0E0E0;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        form input:focus {
            outline: none;
            border-color: #f59e0b; /* amber-500 */
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3);
        }
    </style>
    </head>
<body class="bg-gray-900 text-white">

    <!-- Header -->
    <header class="bg-black bg-opacity-50 backdrop-blur-md sticky top-0 z-50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-2xl font-bold text-amber-400">تمیز کافه</a>
            <div class="flex items-center space-x-6 space-x-reverse">
        {% if user.is_authenticated %}
                    <span class="text-gray-300 hidden sm:block">سلام، {{ user.phone }}!</span>
                    <a href="{% url 'dashboard' %}" class="hover:text-amber-400 transition-colors duration-300">داشبورد</a>
            <form action="{% url 'logout' %}" method="post" style="display: inline;">
                {% csrf_token %}
                        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-300">خروج</button>
            </form>
        {% else %}
                    <a href="{% url 'login' %}" class="hover:text-amber-400 transition-colors duration-300">ورود</a>
                    <a href="{% url 'signup' %}" class="bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-2 px-4 rounded-lg transition-colors duration-300">ثبت‌نام</a>
        {% endif %}
            </div>
    </nav>
</header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-12 min-h-screen">
    {% block content %}
    {% endblock %}
</main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800">
        <div class="container mx-auto px-6 py-8 text-center text-gray-500">
            <p>&copy; {% now "Y" %} کافه پارسی. تمام حقوق محفوظ است.</p>
        </div>
</footer>

</body>
</html>
