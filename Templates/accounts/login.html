{% extends "base.html" %}

{% block title %}ورود{% endblock %}

{% block content %}
<div class="flex justify-center items-center py-10">
    <div class="w-full max-w-md glass-card rounded-2xl p-8">
        <h2 class="text-3xl font-bold text-center text-amber-400 mb-8">ورود به حساب کاربری</h2>
        
  {% if form.errors %}
            <div class="bg-red-500 bg-opacity-30 text-red-300 p-3 rounded-lg mb-6 text-center">
                <p>شماره تلفن یا رمز عبور اشتباه است.</p>
            </div>
  {% endif %}

        <form method="post" class="space-y-6">
    {% csrf_token %}
    {{ form.as_p }}
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-3 px-4 rounded-lg transition-all duration-300 transform hover:scale-105">
                ورود
            </button>
  </form>
        <p class="text-center text-gray-400 mt-6">
            حساب کاربری ندارید؟ <a href="{% url 'signup' %}" class="text-amber-400 hover:underline">ثبت‌نام کنید</a>
        </p>
    </div>
</div>
{% endblock %}
