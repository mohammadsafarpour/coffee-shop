{% extends "base.html" %}

{% block title %}ورود{% endblock %}

{% block content %}
  <h2>ورود به حساب کاربری</h2>
  {% if form.errors %}
    <p style="color: red;">شماره تلفن یا رمز عبور اشتباه است.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">ورود</button>
  </form>
{% endblock %}
