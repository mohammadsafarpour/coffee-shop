{% extends "base.html" %}

{% block title %}ویرایش پروفایل{% endblock %}

{% block content %}
<div class="flex justify-center items-center py-10">
    <div class="w-full max-w-2xl glass-card rounded-2xl p-8">
        <h2 class="text-3xl font-bold text-center text-amber-400 mb-8">ویرایش پروفایل</h2>
        
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                {{ user_form.as_p }}
                {{ profile_form.as_p }}
            </div>
            
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-3 px-4 rounded-lg transition-all duration-300 transform hover:scale-105 mt-4">
                ذخیره تغییرات
            </button>
        </form>
        <p class="text-center text-gray-400 mt-6">
            <a href="{% url 'dashboard' %}" class="text-amber-400 hover:underline">بازگشت به داشبورد</a>
        </p>
    </div>
</div>
{% endblock %}
